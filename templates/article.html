{% extends "base.html" %}

{% block content %}
<h1>{{ article.hebrew_title }}</h1>
<section class="article scriptures rtl">
	{% for paragraph in article.layout %}
	<section class="paragraph">
		{% for line in paragraph %}
		<div class="line">
			{% for word in line %}
			{{ word.text }}
			{% endfor %}
		</div>
		{% endfor %}
	</section>
	{% endfor %}
</section>
{% endblock %}
