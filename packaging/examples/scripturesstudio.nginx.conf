# Sample nginx reverse-proxy config for scripturesstudio, terminating TLS.
# Copy to /etc/nginx/sites-available/scripturesstudio, adjust server_name and
# certificate paths, then symlink into sites-enabled.
server {
    listen 443 ssl;
    server_name studio.example.org;

    ssl_certificate     /etc/letsencrypt/live/studio.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name studio.example.org;
    return 301 https://$host$request_uri;
}
